name: Every state

# The long checks. All 511 states with a ring on are simulated for three seconds each, to see that the toy
# holds together in every one. And a hand moves ring 1 there and back from every state where a hand can, to
# see that the ring arrives each time. They take many minutes, so they run only when the simulation or the
# toy's shapes change, or when asked for by hand.

on:
  pull_request:
    paths:
      - "NineRingsKit/Sources/Simulation/**"
      - "NineRingsKit/Sources/Toy/**"
      - "NineRingsKit/Tests/SimulationTests/**"
      - "NineRingsKit/Package.swift"
      - ".github/workflows/sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sweep-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  sweep:
    name: Every state holds together
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Simulate every state
        run: swift test --package-path NineRingsKit -c release -Xswiftc -enable-testing --filter everyStateHoldsTogether
        env:
          NINE_RINGS_FULL_SWEEP: "1"

  hand:
    name: A hand moves ring 1 wherever it can
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Move ring 1 there and back in every state
        run: swift test --package-path NineRingsKit -c release -Xswiftc -enable-testing --filter aHandMovesRingOneWhereverItSaysItCan
        env:
          NINE_RINGS_FULL_SWEEP: "1"
